name: Deploy AutoAdmin a Azure App Service

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: CAMBIAR-por-el-nombre-de-tu-app-service
  NODE_VERSION: '24.x'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Compilar frontend (React + Vite)
        working-directory: autoadmin-front
        run: |
          npm ci
          npm run build

      - name: Copiar el build al backend
        run: |
          rm -rf autoadmin-backend/public
          cp -r autoadmin-front/dist autoadmin-backend/public

      - name: Instalar dependencias de produccion del backend
        working-directory: autoadmin-backend
        run: npm ci --omit=dev

      - name: Desplegar en Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: autoadmin-backend
