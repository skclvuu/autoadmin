
name: Prueba conexion AutoAdmin Azure

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  test-azure:
    if: github.ref == 'refs/heads/azure-test'
    runs-on: ubuntu-latest

    steps:
      - name: Autenticacion OIDC con Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Verificar Azure App Service
        run: |
          az webapp show \
            --resource-group AutoAdmin-RG \
            --name autoadmin-web \
            --query "{nombre:name,estado:state}" \
            --output table

        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: autoadmin-backend
